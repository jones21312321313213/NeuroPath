name: CI

on:
  push:
    branches: [main, development, staging]
  pull_request:
    branches: [main, development, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuropath-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neuropath_ci
          POSTGRES_USER: neuropath_ci
          POSTGRES_PASSWORD: neuropath_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuropath_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: neuropath_ci
      DB_USER: neuropath_ci
      DB_PASSWORD: neuropath_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neuropath-backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Build (collect static files)
        run: python manage.py collectstatic --noinput

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuropath-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: neuropath-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
