name: PR Template Compliance

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  validate-pr-description:
    name: Validate PR Template
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Body Compliance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import re

          body = os.environ.get("PR_BODY", "") or ""
          title = os.environ.get("PR_TITLE", "") or ""

          print("=== Validating PR Title & Description ===")
          errors = []
          warnings = []

          if not body.strip():
              print("::error::PR description is completely empty! Please fill out the pull request template.")
              sys.exit(1)

          # 1. Check for linked issue (Closes #123, Fixes #123, Resolves #123)
          if not re.search(r"(closes|fixes|resolves)\s*#[0-9]+", body, re.IGNORECASE):
              errors.append("Missing linked issue! Please specify 'Closes #<issue_number>' in the Linked Issue section.")

          # 2. Check for empty or default placeholder summary
          if "Replace this text with a summary" in body:
              errors.append("Summary section contains default placeholder text. Please replace it with your description.")
          else:
              summary_match = re.search(r"##\s*Summary\s*\n+([\s\S]*?)(?=\n##|\Z)", body, re.IGNORECASE)
              summary_text = summary_match.group(1).strip() if summary_match else ""
              if not summary_text or len(summary_text) < 10:
                  errors.append("Summary section is empty or too short. Please provide a clear summary of your changes.")

          # 3. Check that at least one 'Type of Change' checkbox is selected
          if not re.search(r"^-\s*\[[xX]\]\s*(Bug fix|New feature|Breaking change|Documentation|Refactor)", body, re.MULTILINE | re.IGNORECASE):
              errors.append("Please select at least one box under 'Type of Change' (- [x]).")

          # 4. Check that at least one 'How Has This Been Tested?' checkbox is selected
          if not re.search(r"^-\s*\[[xX]\]\s*(Unit tests|Integration tests|Manual verification)", body, re.MULTILINE | re.IGNORECASE):
              errors.append("Please select at least one testing method under 'How Has This Been Tested?' (- [x]).")

          # 5. Check Conventional Commits title format (warning only)
          if not re.search(r"^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\([a-zA-Z0-9_-]+\))?:\s*.+", title, re.IGNORECASE):
              warnings.append("PR Title should follow Conventional Commits (e.g. 'feat(frontend): ...', 'fix(backend): ...').")

          for w in warnings:
              print(f"::warning::{w}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              print(f"❌ PR description does not satisfy the PR template requirements ({len(errors)} error(s) found).")
              sys.exit(1)

          print("✅ PR description is fully compliant with the project template!")
          EOF
